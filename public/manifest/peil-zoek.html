<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoek een bedrag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:#fff;color:#333;font-family:Mulish,system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{padding:16px;max-width:820px;margin:0 auto}
label{display:block;font-family:Poppins,sans-serif;font-weight:600;color:#800000;margin-bottom:6px}
input{width:100%;min-height:48px;padding:10px 14px;font:inherit;color:#333;background:#fff;border:2px solid #800000;border-radius:12px}
input:focus{outline:3px solid rgba(128,0,0,.25);outline-offset:1px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.filters button{font:inherit;font-size:.92rem;min-height:44px;padding:6px 14px;color:#800000;background:#fff;border:2px solid #800000;border-radius:22px;cursor:pointer}
.filters button[aria-pressed=true]{background:#800000;color:#fff}
.filters button:focus-visible{outline:3px solid rgba(128,0,0,.25);outline-offset:1px}
.melden{margin-top:6px}
.kop{margin:16px 0 8px;font-size:.9rem;color:#666}
#res{margin-top:12px;display:grid;gap:12px}
.kaart{border:1px solid #e3d8d8;border-radius:14px;padding:14px 16px;background:#fff}
.rij{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.naam{font-weight:700;min-width:0;overflow-wrap:anywhere}
.waarde{font-weight:700;color:#800000;text-align:right;max-width:55%;overflow-wrap:anywhere}
.klein{font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.klein a{color:#800000;text-decoration:underline;display:inline-block;padding:2px 0}
.voet{margin-top:12px;font-size:.85rem;color:#666}.voet a{color:#800000}
.meer{margin-top:12px;font:inherit;min-height:48px;padding:8px 18px;color:#fff;background:#800000;border:2px solid #800000;border-radius:24px;cursor:pointer}
details.vind{margin-top:4px;font-size:.88rem;color:#555}details.vind summary{cursor:pointer;color:#800000;min-height:32px;display:list-item}details.vind div{overflow-wrap:anywhere}
.leeg{padding:14px 16px;border-radius:14px;background:#f7f1f1}
.leeg a{color:#800000;text-decoration:underline;display:inline-block;min-height:44px;line-height:44px}
@media(max-width:480px){.rij{flex-direction:column;gap:2px}.waarde{text-align:left;max-width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <label for="q">Zoek een bedrag</label>
  <input id="q" type="search" autocomplete="off" placeholder="bijvoorbeeld schenking kind, woonlandfactor, IFI">
  <div class="filters" id="cat" role="group" aria-label="Categorie"></div>
  <div class="filters" id="land" role="group" aria-label="Land"></div>
  <div class="kop" id="kop"></div>
  <div id="res" aria-live="polite"></div>
</div>
<script>
(function(){
var CATS=[['Alles','Alle onderwerpen']].concat(['Inkomstenbelasting','Erven en schenken','Vastgoed en wonen','Zorg, sociaal en administratie','Ondernemen','Energie en verbouwen'].map(function(c){return[c,c]}));
var LANDEN=[['Beide','Beide landen'],['FR','Frankrijk'],['NL','Nederland']];
var cat='Alles',lnd='Beide',alle=false;
var MAIL='info@communitiesabroad.com';
var data=[],q=document.getElementById('q'),res=document.getElementById('res'),kop=document.getElementById('kop');
var LAND={FR:'Frankrijk',NL:'Nederland',XB:'Nederland en Frankrijk'};
var MND=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function datum(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?(+m[3])+' '+MND[+m[2]-1]+' '+m[1]:''}
function jaar(p){if(p.geldig_jaar)return p.geldig_jaar;if(p.geldig_van&&p.geldig_tot)return datum(p.geldig_van)+' tot '+datum(p.geldig_tot);if(p.geldig_van)return 'vanaf '+datum(p.geldig_van);return ''}
function schoon(k){
  return String(k||'').replace(/\s*[,;]?\s*[^,;.]*\b(gaf|geeft) 403\b[^,;]*/gi,'').replace(/([,;.:])\s*([,;.:])/g,'$2').replace(/[\s,;]+$/,'').replace(/^[\s,;]+/,'').trim();
}
function kaart(p){
  var g=jaar(p),land=LAND[p.land]||p.land||'',kk=p.bron_kenmerk||'',gj=String(p.geldig_jaar||'');
  var gt=g?'Geldt in '+esc(g):'';
  if(/^\d{4}$/.test(gj))gt='Geldt in kalenderjaar '+esc(gj);
  if(/Brochure pratique IR 2026/i.test(kk)){
    if(/^\d{4}$/.test(gj))gt='Geldt voor inkomsten '+gj+', aangifte '+(+gj+1);
    else if(/^(\d{4})-(\d{4})$/.test(gj)){var mm=/^(\d{4})-(\d{4})$/.exec(gj);gt='Geldt voor inkomsten '+mm[1]+' en '+mm[2]}
  }
  var geldt=gt+(gt&&land?', ':'')+esc(land);
  var bron='',vol=schoon(kk),kort=vol.split(';')[0].trim();
  if(kort.length>90){kort=kort.slice(0,90);var sp=kort.lastIndexOf(' ');if(sp>50)kort=kort.slice(0,sp);kort=kort.replace(/[\s,.:;(]+$/,'')+'…'}
  if(p.bron_url){var t=kort;if(!t){try{t=new URL(p.bron_url).hostname.replace(/^www\./,'')}catch(e){t=p.bron_url}}
    bron='<div class="klein">Bron: <a href="'+esc(p.bron_url)+'" target="_blank" rel="noopener">'+esc(t)+'</a></div>'}
  else if(kort){bron='<div class="klein">Bron: '+esc(kort)+'</div>'}
  if(vol&&vol!==kort)bron+='<details class="vind"><summary>Volledige vindplaats</summary><div>'+esc(vol)+'</div></details>';
  var gebruikt='';
  if(p.tools&&p.tools.length){gebruikt='<div class="klein">Gebruikt in: '+p.tools.map(function(t){return '<a href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.naam)+'</a>'}).join(', ')+'</div>'}
  var d=datum(p.verificatiedatum);
  var meld='mailto:'+MAIL+'?subject='+encodeURIComponent('Peil: '+p.naam)+'&body='+encodeURIComponent('Bedrag: '+p.naam+'\nWaarde volgens Peil: '+p.waarde_weergave+'\nWat klopt er volgens u niet, en wat is uw bron?\n\n(kenmerk: '+p.id+')');
  return '<article class="kaart"><div class="rij"><div class="naam">'+esc(p.naam)+'</div><div class="waarde">'+esc(p.waarde_weergave)+'</div></div>'+
   (geldt?'<div class="klein">'+geldt+'</div>':'')+bron+gebruikt+(d?'<div class="klein">Gecontroleerd op '+esc(d)+'</div>':'')+
   '<div class="klein melden"><a href="'+esc(meld)+'">Klopt dit niet? Meld het</a></div></article>';
}
function voorbeelden(){
  var ids=['abattement_per_kind','woonlandfactor','ir.schijven'],out=[];
  ids.forEach(function(k){for(var i=0;i<data.length;i++){if(data[i].id.indexOf(k)>-1){out.push(data[i]);break}}});
  return out;
}
function score1(p,t){
  var n=norm(p.naam),f=norm(p.naam_fr),i=norm(p.id),w=norm(p.trefwoorden);
  if(n.indexOf(t)===0)return 0;
  if(new RegExp('(^|[^a-z0-9])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(n))return 1;
  if(n.indexOf(t)>-1)return 2;
  if(f.indexOf(t)>-1)return 3;
  if(w.indexOf(t)>-1)return 4;
  if(i.indexOf(t)>-1)return 5;
  return -1;
}
function delen(p,t){
  if(t.length<6)return false;
  var ws=(norm(p.naam)+' '+norm(p.naam_fr)+' '+norm(p.trefwoorden)).split(/[^a-z0-9]+/);
  for(var i=0;i<ws.length;i++){if(ws[i].length>=5&&t.indexOf(ws[i])>-1)return true}
  return false;
}
function score(p,t){
  var x=score1(p,t);if(x>=0||t.length<6)return x;
  var kort=t.replace(/(en|s)$/,'');if(kort!==t){x=score1(p,kort);if(x>=0)return x+1}
  if(delen(p,t))return 6;
  return -1;
}
function render(){
  var t=norm(q.value).trim(),html;
  function pas(p){return (cat==='Alles'||p.categorie===cat)&&(lnd==='Beide'||p.land===lnd||p.land==='XB')}
  if(!t&&cat==='Alles'&&lnd==='Beide'){
    kop.textContent='Voorbeelden';
    html=voorbeelden().map(kaart).join('');
    html+='<div class="voet">Geen mailprogramma? Mail naar '+MAIL+'.</div>';
  }else{
    var woorden=t?t.split(/\s+/):[];
    var r=[];
    data.forEach(function(p){
      if(!pas(p))return;
      var s=0;
      for(var k=0;k<woorden.length;k++){
        var x=score(p,woorden[k]);
        if(x<0){s=-1;break}
        s+=x;
      }
      if(s>=0)r.push([s,p]);
    });
    r.sort(function(a,b){return a[0]-b[0]||(a[1].naam<b[1].naam?-1:1)});
    var tot=r.length;
    if(t&&!alle)r=r.slice(0,20);
    kop.textContent=tot?(tot>r.length?(r.length+' van '+tot+' getoond'):(tot+' gevonden')):'';
    var elders=0;
    if(!tot&&t&&(cat!=='Alles'||lnd!=='Beide')){
      data.forEach(function(p){for(var k=0;k<woorden.length;k++){if(score(p,woorden[k])<0)return}elders++});
    }
    function label(l,w){for(var i=0;i<l.length;i++)if(l[i][0]===w)return l[i][1];return w}
    html=r.length?r.map(function(x){return kaart(x[1])}).join(''):
      (elders?'<div class="leeg">Niets gevonden binnen de gekozen filters ('+esc([cat!=='Alles'?label(CATS,cat):'',lnd!=='Beide'?label(LANDEN,lnd):''].filter(Boolean).join(', '))+'). Zonder filters zijn er '+elders+' resultaten. <button type="button" class="meer" id="wis">Zoek in alle onderwerpen en landen</button></div>':
      '<div class="leeg">Geen bedrag gevonden. Mist u een bedrag? Laat het ons weten per <a href="mailto:'+MAIL+'?subject='+encodeURIComponent('Peil: ontbrekend bedrag')+'">e-mail</a>.</div>');
    if(tot>r.length)html+='<button type="button" class="meer" id="meer">Toon alle '+tot+'</button>';
    if(r.length)html+='<div class="voet">Geen mailprogramma? Mail naar '+MAIL+'.</div>';
  }
  res.innerHTML=html;
  var mb=document.getElementById('meer');if(mb)mb.onclick=function(){alle=true;render()};
  var wb=document.getElementById('wis');if(wb)wb.onclick=function(){cat='Alles';lnd='Beide';alle=false;knoppen(document.getElementById('cat'),CATS,function(){return cat},function(v){cat=v});knoppen(document.getElementById('land'),LANDEN,function(){return lnd},function(v){lnd=v});render()};
  melden();
}
function knoppen(el,lijst,get,set){
  el.innerHTML=lijst.map(function(x){return '<button type="button" data-w="'+esc(x[0])+'" aria-pressed="'+(get()===x[0])+'">'+esc(x[1])+'</button>'}).join('');
  el.onclick=function(e){var b=e.target.closest('button');if(!b)return;set(b.getAttribute('data-w'));alle=false;knoppen(el,lijst,get,set);render()};
}
function melden(){try{window.parent.postMessage({type:'ca-hoogte',id:'peil-zoek',hoogte:document.documentElement.scrollHeight},'*')}catch(e){}}
knoppen(document.getElementById('cat'),CATS,function(){return cat},function(v){cat=v});
knoppen(document.getElementById('land'),LANDEN,function(){return lnd},function(v){lnd=v});
q.addEventListener('input',function(){alle=false;render()});
if(window.ResizeObserver)new ResizeObserver(melden).observe(document.body);
window.addEventListener('load',melden);
fetch('peil-zoek.json').then(function(r){return r.json()}).then(function(j){data=j.parameters||[];render()})
 .catch(function(){res.innerHTML='<div class="leeg">De bedragen konden niet worden geladen. Probeer het later opnieuw.</div>';melden()});
melden();
})();
</script>
</body>
</html>
